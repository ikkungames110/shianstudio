<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>しあんスタジオ | SHIAN STUDIO</title>
    <meta name="description" content="しあんスタジオが制作したゲームや診断を紹介しています。">
    <meta name="author" content="SHIAN STUDIO">
    <link rel="canonical" href="https://shianstudio.com/">
    <style>
      :root {
        color-scheme: light;
        font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
        color: #252331;
        background: #fffdf7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: flex;
        flex-direction: column;
      }

      a {
        color: inherit;
      }

      a:focus-visible {
        outline: 3px solid #4d5fcb;
        outline-offset: 5px;
      }

      main,
      footer {
        width: min(720px, calc(100% - 40px));
        margin-inline: auto;
      }

      main {
        flex: 1;
        padding-block: 72px 64px;
      }

      .intro {
        margin-bottom: 40px;
      }

      .logo {
        display: block;
        width: 72px;
        height: 72px;
        margin-bottom: 24px;
        border-radius: 12px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        line-height: 1.4;
      }

      .intro p {
        margin: 12px 0 0;
        color: #666174;
        font-size: 0.95rem;
        line-height: 1.8;
      }

      .sites {
        display: grid;
        gap: 14px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .site-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 24px;
        border: 1px solid #e8e0d1;
        border-radius: 12px;
        background: #fff;
        text-decoration: none;
      }

      .site-link:hover {
        border-color: #4d5fcb;
        background: #f7f8ff;
      }

      .site-name {
        display: block;
        font-size: 1.15rem;
        font-weight: 700;
      }

      .site-url {
        display: block;
        margin-top: 6px;
        color: #666174;
        font-size: 0.8rem;
        overflow-wrap: anywhere;
      }

      .arrow {
        flex-shrink: 0;
        color: #4d5fcb;
        font-size: 1.4rem;
      }

      footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-block: 24px;
        border-top: 1px solid #e8e0d1;
        color: #666174;
        font-size: 0.75rem;
      }

      footer nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 16px;
      }

      footer a {
        text-underline-offset: 4px;
      }

      @media (max-width: 480px) {
        main {
          padding-block: 40px;
        }

        .site-link {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="intro">
        <img class="logo" src="/logo.jpg" alt="しあんスタジオのロゴ" width="72" height="72">
        <h1>しあんスタジオ</h1>
        <p>制作したゲームや診断を紹介しています。</p>
      </header>

      <nav aria-label="制作したサイト">
        <ul class="sites">
          <li>
            <a class="site-link" href="https://type-checker.shianstudio.com/top/">
              <span>
                <span class="site-name">好みの顔タイプ診断</span>
                <span class="site-url">type-checker.shianstudio.com/top/</span>
              </span>
              <span class="arrow" aria-hidden="true">→</span>
            </a>
          </li>
          <li>
            <a class="site-link" href="https://tetcla.shianstudio.com/">
              <span>
                <span class="site-name">Tetcla</span>
                <span class="site-url">tetcla.shianstudio.com</span>
              </span>
              <span class="arrow" aria-hidden="true">→</span>
            </a>
          </li>
          <li>
            <a class="site-link" href="https://majan.shianstudio.com/">
              <span>
                <span class="site-name">Majan</span>
                <span class="site-url">majan.shianstudio.com</span>
              </span>
              <span class="arrow" aria-hidden="true">→</span>
            </a>
          </li>
        </ul>
      </nav>
    </main>

    <footer>
      <span>© SHIAN STUDIO</span>
      <nav aria-label="フッターナビゲーション">
        <a href="/privacy.html">プライバシーポリシー</a>
        <a href="/terms.html">利用規約</a>
        <a href="/contact.html">お問い合わせ</a>
        <a href="https://x.com/shianstudio?s=11" target="_blank" rel="noopener noreferrer">X</a>
      </nav>
    </footer>
  </body>
</html>
